<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leon Diamond — QR Code</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #ffffff;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 20px;
}
.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.qr-wrap {
  width: 300px;
  height: 300px;
  border: 1px solid #e0e0e0;
  padding: 16px;
  background: #fff;
}
#qrcode {
  width: 100%;
  height: 100%;
}
#qrcode canvas,
#qrcode img {
  width: 100% !important;
  height: 100% !important;
}
.divider {
  width: 300px;
  height: 1px;
  background: #e8e8e8;
  margin: 28px 0 24px;
}
.brand {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #0a0a0a;
  text-align: center;
}
.subtext {
  font-size: 13px;
  font-weight: 400;
  color: #888;
  letter-spacing: 0.5px;
  margin-top: 8px;
  text-align: center;
}
.url {
  font-size: 11px;
  font-weight: 500;
  color: #bbb;
  letter-spacing: 0.3px;
  margin-top: 6px;
  text-align: center;
}

@media print {
  @page { margin: 0; size: A4; }
  html, body {
    height: auto;
    min-height: unset;
    padding: 0;
  }
  body {
    display: block;
    padding-top: 80px;
  }
  .card {
    margin: 0 auto;
    width: fit-content;
  }
}
</style>
</head>
<body>
<div class="card">
  <div class="qr-wrap">
    <div id="qrcode"></div>
  </div>
  <div class="divider"></div>
  <div class="brand">Leon Diamond</div>
  <div class="subtext">Scan to visit our website</div>
  <div class="url">leondiamond.danielhendra.com</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById('qrcode'), {
  text: 'https://leondiamond.danielhendra.com',
  width: 268,
  height: 268,
  colorDark: '#0a0a0a',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
